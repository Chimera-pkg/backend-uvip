# ============================================================
# UVIP — Nginx Reverse Proxy Config
# ============================================================
# CARA PAKAI:
#   1. Copy file ini ke /etc/nginx/sites-available/uvip
#   2. Symlink ke sites-enabled:
#      sudo ln -s /etc/nginx/sites-available/uvip /etc/nginx/sites-enabled/uvip
#   3. Test config:
#      sudo nginx -t
#   4. Reload Nginx:
#      sudo systemctl reload nginx
#
# AKSES:
#   http://IP_VPS:8001/          → API root
#   http://IP_VPS:8001/docs      → Swagger UI
#   http://IP_VPS:8001/redoc     → ReDoc
#   http://IP_VPS:8001/api-docs  → Custom API docs
# ============================================================

# Upstream — backend UVIP di Docker
upstream uvip_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 8001;
    server_name _;

    # Max upload size (untuk upload foto street-level)
    client_max_body_size 50M;

    # Timeout untuk request lama (segmentasi, dll)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Logging terpisah — tidak campur dengan project lain
    access_log /var/log/nginx/uvip_access.log;
    error_log  /var/log/nginx/uvip_error.log;

    # ---- API endpoints ----
    location / {
        proxy_pass http://uvip_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---- Uploaded files (static) ----
    # Opsional: kalau mau Nginx yang serve file uploads langsung (lebih cepat)
    # Uncomment baris di bawah dan sesuaikan path volume Docker
    # location /uploads/ {
    #     alias /var/lib/docker/volumes/uvip_uploads/_data/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}
